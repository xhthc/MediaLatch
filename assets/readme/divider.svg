<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="24" viewBox="0 0 1120 24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d2342" stop-opacity="0" />
      <stop offset="20%" stop-color="#2d2342" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#2d2342" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2d2342" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="divGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
    <style>
.root{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
@keyframes breathe{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}
.div-node{animation:breathe 8s cubic-bezier(.77,0,.175,1) infinite both}
@media(prefers-reduced-motion:reduce){.div-node{animation:none}}
</style>
  </defs>
  <line x1="0" y1="12" x2="1120" y2="12" stroke="url(#divLine)" stroke-width="1" />
  <ellipse cx="560" cy="12" rx="64" ry="8" fill="url(#divGlow)" />
  <g class="div-node">
    <rect x="553" y="5" width="14" height="14" rx="4" transform="rotate(45 560 12)" fill="#191329" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="560" cy="12" r="2.2" fill="#d8b4fe" />
  </g>
</svg>
