      <path d="m10 -4 4 4-4 4" fill="none" stroke="#3b2d56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="2" y1="0" x2="14" y2="0" stroke="#c084fc" stroke-width="2" stroke-linecap="round" class="flow-arrow-pulse" style="animation-delay:2.45s" />
