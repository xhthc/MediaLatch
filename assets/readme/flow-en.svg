    <style>
.root{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
@keyframes flowFocus1{0%{opacity:0}2.5%{opacity:0}4%{opacity:1}10%{opacity:1}12.5%{opacity:0}100%{opacity:0}}
@keyframes flowBar1{0%{transform:scaleX(.02);opacity:.35}2.5%{transform:scaleX(.02);opacity:.35}10.625%{transform:scaleX(1);opacity:1}87.5%{transform:scaleX(1);opacity:1}90%{transform:scaleX(1);opacity:0}90.012%{transform:scaleX(.02);opacity:0}95%{transform:scaleX(.02);opacity:.35}100%{transform:scaleX(.02);opacity:.35}}
@keyframes flowFocus2{0%{opacity:0}13.75%{opacity:0}15.25%{opacity:1}21.25%{opacity:1}23.75%{opacity:0}100%{opacity:0}}
