.flow-arrow-pulse{opacity:0;animation:flowArrow1 8s cubic-bezier(.23,1,.32,1) infinite both}
.flow-bar-fill{transform-box:fill-box;transform-origin:left center;animation:flowBar1 8s cubic-bezier(.77,0,.175,1) infinite both}
