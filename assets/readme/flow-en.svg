<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-label="From selected media to your files: 4 stages of MediaLatch">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140f21" />
      <stop offset="100%" stop-color="#090610" />
    </linearGradient>
    <linearGradient id="flowCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b142c" />
      <stop offset="100%" stop-color="#110c1c" />
    </linearGradient>
    <linearGradient id="flowBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="flowGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <style>
      .root {font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
      .mono {font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
      @keyframes highlight {0%,100% {opacity:0} 15%,75% {opacity:1}}
      @keyframes fillBar {from {transform:scaleX(.02);opacity:.35} to {transform:scaleX(1);opacity:1}}
      @keyframes complete {from {opacity:0} to {opacity:1}}
      @keyframes fadeAway {from {opacity:1} to {opacity:0}}

      .flow-card-active,.flow-arrow-pulse {opacity:0;animation:highlight .8s ease both}
      .flow-bar-fill {transform-box:fill-box;transform-origin:left center;animation:fillBar .65s cubic-bezier(.77,0,.175,1) both}
      @media (prefers-reduced-motion:reduce) {.flow-card-active,.flow-arrow-pulse,.flow-bar-fill {animation:none}}
</style>
  </defs>

  <g class="root" data-panel="surface">
    <rect x="0.5" y="0.5" width="1119" height="239" rx="18" fill="url(#flowBg)" stroke="#2d2342" stroke-width="1" />
    <rect x="1" y="1" width="1118" height="238" rx="17.5" fill="url(#flowGlow)" />
    <line x1="24" y1="1.5" x2="1096" y2="1.5" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1" />

    <text x="32" y="38" fill="#f4effc" font-size="19" font-weight="600" letter-spacing="-0.3">From selected media to your files</text>
    <text x="32" y="60" fill="#ab9fc6" font-size="13">Select media, check the source, save and preview locally</text>


    <g transform="translate(32 84)" data-card="flow" data-panel="surface">
      <rect width="252" height="126" rx="14" fill="url(#flowCard)" stroke="#2d2342" stroke-width="1" />
      <rect width="252" height="126" rx="14" fill="none" stroke="#b693ff" stroke-width="1.4" class="flow-card-active" style="animation-delay:0.2s" />
      <line x1="16" y1="1" x2="236" y2="1" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1" />

      <g transform="translate(16 16)">
        <rect width="38" height="26" rx="8" fill="#251842" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
        <text x="19" y="17.5" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="700" class="mono">01</text>
      </g>
      <text x="64" y="34.5" fill="#f4effc" font-size="16" font-weight="600" letter-spacing="-0.2">Select</text>

