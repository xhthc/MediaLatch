<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="176" viewBox="0 0 1120 176" role="img" aria-labelledby="title desc">
  <title id="title">Local check in Developer mode</title>
  <desc id="desc">Open the extensions page, enable Developer mode, load the verified runtime folder, then reload the source tabs.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#100b1d"/><stop offset="1" stop-color="#090d16"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset=".48" stop-color="#a78bfa"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#b0a0de" stroke-opacity=".065"/></pattern>
  </defs>
  <style>
    text { font-family:Arial,Helvetica,sans-serif; fill:#f3efff }
    .muted { fill:#b7acce } .mono { font-family:Consolas,'Courier New',monospace; letter-spacing:.5px }
    .cursor {animation:cursor 1.2s ease 4 both} @keyframes cursor {0%,100% {opacity:.25} 50% {opacity:1}}
    @media (prefers-reduced-motion:reduce) { .orbit,.packet,.pulse,.cursor { animation:none; transform:none } }
  </style>
  <rect x=".5" y=".5" width="1119" height="175" rx="12" fill="#0b0b18" stroke="#3a3157"/>
  <path d="M1 38h1118" stroke="#29223d"/>
  <circle cx="22" cy="20" r="4" fill="#fb7185"/><circle cx="38" cy="20" r="4" fill="#fbbf24"/><circle cx="54" cy="20" r="4" fill="#34d399"/>
  <text class="mono muted" x="74" y="24" font-size="12">Local check in Developer mode</text>
  <text class="mono" x="32" y="95" font-size="30" style="fill:#67e8f9">chrome://extensions</text>
  <rect class="cursor" x="391" y="72" width="10" height="28" rx="2" fill="#a78bfa"/>
  <text class="muted" x="32" y="145" font-size="15">1  Enable Developer mode</text>
  <text class="muted" x="392" y="145" font-size="15">2  Load the runtime folder</text>
  <text class="muted" x="752" y="145" font-size="15">3  Reload your source tabs</text>
</svg>
