<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="304" viewBox="0 0 1120 304" role="img" aria-labelledby="title desc">
  <title id="title">MediaLatch installation and packages</title>
  <desc id="desc">Open Releases, download the CRX and SHA-256 checksum, then verify the file. Use the Web Store for Chrome on Windows and macOS; manual CRX installation depends on browser policies.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#100b1d"/><stop offset="1" stop-color="#090d16"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset=".48" stop-color="#a78bfa"/><stop offset="1" stop-color="#d8b4fe"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#7c3aed" stop-opacity=".23"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#b0a0de" stroke-opacity=".065"/></pattern>
  </defs>
  <style>
    text {font-family:Arial,Helvetica,sans-serif;fill:#f3efff}
    .muted {fill:#b7acce}.mono {font-family:Consolas,'Courier New',monospace}
    .letter {animation:reveal .03s linear both}
    .cursor {opacity:0;animation:type-cursor .7s steps(14,end) .18s both,cursor-off .18s linear 1.02s both}
    .step-active {opacity:0;animation:focus .9s ease both;animation-delay:var(--start)}
    .step-check {animation:reveal .18s cubic-bezier(.23,1,.32,1) both;animation-delay:calc(var(--start) + .75s)}
    .step-progress {transform-box:fill-box;transform-origin:left center;animation:progress .8s cubic-bezier(.77,0,.175,1) both;animation-delay:var(--start)}
    .install-icon {animation:settle .2s cubic-bezier(.23,1,.32,1) both;animation-delay:var(--start)}
    @keyframes reveal {from {opacity:0} to {opacity:1}}
    @keyframes type-cursor {from {transform:translateX(0);opacity:1} to {transform:translateX(252px);opacity:1}}
    @keyframes cursor-off {from {opacity:1} to {opacity:0}}
    @keyframes focus {0%,100% {opacity:0} 15%,80% {opacity:1}}
    @keyframes progress {from {transform:scaleX(.01);opacity:.2} to {transform:scaleX(1);opacity:1}}
    @keyframes settle {from {transform:translateY(4px);opacity:.3} to {transform:translateY(0);opacity:1}}
    @media (prefers-reduced-motion:reduce) {
      .letter,.cursor,.step-active,.step-check,.step-progress,.install-icon {animation:none}
    }
  </style>
  <rect x=".5" y=".5" width="1119" height="303" rx="12" fill="#0b0b18" stroke="#3a3157"/>
  <path d="M1 38h1118" stroke="#29223d"/>
  <circle cx="22" cy="20" r="4" fill="#fb7185"/><circle cx="38" cy="20" r="4" fill="#fbbf24"/><circle cx="54" cy="20" r="4" fill="#34d399"/>
  <text class="mono muted" x="74" y="24" font-size="12">MediaLatch installation and packages</text>
  <rect x="24" y="58" width="1072" height="64" rx="9" fill="#111222" stroke="#292a43"/>
  <path d="M40 77h10l6 6v20H40zM50 77v7h6" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" y="99" font-size="28" style="fill:#67e8f9"><tspan class="letter" x="64" style="animation-delay:0.18s">M</tspan><tspan class="letter" x="82" style="animation-delay:0.23s">e</tspan><tspan class="letter" x="100" style="animation-delay:0.28s">d</tspan><tspan class="letter" x="118" style="animation-delay:0.33s">i</tspan><tspan class="letter" x="136" style="animation-delay:0.38s">a</tspan><tspan class="letter" x="154" style="animation-delay:0.43s">L</tspan><tspan class="letter" x="172" style="animation-delay:0.48s">a</tspan><tspan class="letter" x="190" style="animation-delay:0.53s">t</tspan><tspan class="letter" x="208" style="animation-delay:0.58s">c</tspan><tspan class="letter" x="226" style="animation-delay:0.63s">h</tspan><tspan class="letter" x="244" style="animation-delay:0.68s">.</tspan><tspan class="letter" x="262" style="animation-delay:0.73s">c</tspan><tspan class="letter" x="280" style="animation-delay:0.78s">r</tspan><tspan class="letter" x="298" style="animation-delay:0.83s">x</tspan></text>
  <rect class="cursor" x="64" y="76" width="3" height="27" rx="1" fill="#a78bfa"/>
  <text class="mono muted" x="1076" y="94" font-size="11" text-anchor="end">PACKAGED BUILD · SHA-256</text>
  <g class="card step" transform="translate(24 146)" style="--start:1.2s">
    <rect width="348" height="132" rx="10" fill="#121020" stroke="#332b49"/>
    <rect class="step-active" x=".5" y=".5" width="347" height="131" rx="10" fill="#1e2339" stroke="#67e8f9" stroke-opacity=".75"/>
    <g class="install-icon"><rect x="16" y="14" width="32" height="32" rx="8" fill="#242039"/><svg x="20" y="18" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></g>
    <circle cx="317" cy="30" r="12" fill="#262039"/>
    <text class="mono muted" x="317" y="34" font-size="12" text-anchor="middle">1</text>
    <g class="step-check"><circle cx="317" cy="30" r="12" fill="#155347"/><path d="m312 30 3.5 3.5 7-7" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="16" y="76" font-size="17" font-weight="700">Open Releases</text>
    <text class="muted" x="16" y="98" font-size="13">Download the CRX and its checksum</text>
    <rect x="16" y="116" width="316" height="2" rx="1" fill="#30263f"/>
    <rect class="step-progress" x="16" y="116" width="316" height="2" rx="1" fill="url(#accent)"/>
  </g>
  <g class="card step" transform="translate(386 146)" style="--start:2.2s">
    <rect width="348" height="132" rx="10" fill="#121020" stroke="#332b49"/>
    <rect class="step-active" x=".5" y=".5" width="347" height="131" rx="10" fill="#1e2339" stroke="#67e8f9" stroke-opacity=".75"/>
    <g class="install-icon"><rect x="16" y="14" width="32" height="32" rx="8" fill="#242039"/><svg x="20" y="18" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/></svg></g>
    <circle cx="317" cy="30" r="12" fill="#262039"/>
    <text class="mono muted" x="317" y="34" font-size="12" text-anchor="middle">2</text>
    <g class="step-check"><circle cx="317" cy="30" r="12" fill="#155347"/><path d="m312 30 3.5 3.5 7-7" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="16" y="76" font-size="17" font-weight="700">Verify SHA-256</text>
    <text class="muted" x="16" y="98" font-size="13">Compare the downloaded file checksum</text>
    <rect x="16" y="116" width="316" height="2" rx="1" fill="#30263f"/>
    <rect class="step-progress" x="16" y="116" width="316" height="2" rx="1" fill="url(#accent)"/>
  </g>
  <g class="card step" transform="translate(748 146)" style="--start:3.2s">
    <rect width="348" height="132" rx="10" fill="#121020" stroke="#332b49"/>
    <rect class="step-active" x=".5" y=".5" width="347" height="131" rx="10" fill="#1e2339" stroke="#67e8f9" stroke-opacity=".75"/>
    <g class="install-icon"><rect x="16" y="14" width="32" height="32" rx="8" fill="#242039"/><svg x="20" y="18" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="3"/><path d="M2 8h20m-14 7 3 3 5-6"/></svg></g>
    <circle cx="317" cy="30" r="12" fill="#262039"/>
    <text class="mono muted" x="317" y="34" font-size="12" text-anchor="middle">3</text>
    <g class="step-check"><circle cx="317" cy="30" r="12" fill="#155347"/><path d="m312 30 3.5 3.5 7-7" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="16" y="76" font-size="17" font-weight="700">Install in your browser</text>
    <text class="muted" x="16" y="98" font-size="13">Chrome: Web Store; CRX where permitted</text>
    <rect x="16" y="116" width="316" height="2" rx="1" fill="#30263f"/>
    <rect class="step-progress" x="16" y="116" width="316" height="2" rx="1" fill="url(#accent)"/>
  </g>
</svg>
