          <text x="30" y="16" fill="#ffffff" font-size="11" font-weight="600">Save all (4)</text>
        </g>
      </g></g>

      <line x1="1" y1="40" x2="487" y2="40" stroke="#2d2342" stroke-width="1" />


      <g transform="translate(18 54)">
