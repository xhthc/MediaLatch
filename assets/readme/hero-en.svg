        <text x="28" y="19" fill="#d8b4fe" font-size="11" font-weight="600" letter-spacing="0.8" class="mono">CHROMIUM / MANIFEST V3</text>
      </g>
    </g>


    <text x="36" y="142" fill="url(#titleGrad)" font-size="44" font-weight="700" letter-spacing="-1.1">MediaLatch</text>
    <text x="36" y="182" fill="#f4effc" font-size="19.5" font-weight="600" letter-spacing="-0.25">Original media. Local previews. Folders in order.</text>
    <text x="36" y="214" fill="#ab9fc6" font-size="14">Images, GIFs and video · Chromium · No companion app</text>


