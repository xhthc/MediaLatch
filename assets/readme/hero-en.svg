<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-label="MediaLatch: original media, local previews, and organized folders">
  <defs>
    <linearGradient id="bgSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140f21" />
      <stop offset="100%" stop-color="#090610" />
    </linearGradient>
    <linearGradient id="subSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b142c" />
      <stop offset="100%" stop-color="#110c1c" />
    </linearGradient>
    <linearGradient id="cardPreviewBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1533" />
      <stop offset="100%" stop-color="#110c1d" />
    </linearGradient>
    <linearGradient id="brandTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#311068" />
    </linearGradient>
    <linearGradient id="brandArrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f4effc" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
    <linearGradient id="primaryPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b46ff" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="progressBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="previewGlow" cx="78%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
    <style>
      .root {font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
      .mono {font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
      @keyframes highlight {0%,100% {opacity:0} 15%,75% {opacity:1}}
      @keyframes fillBar {from {transform:scaleX(.02);opacity:.35} to {transform:scaleX(1);opacity:1}}
      @keyframes complete {from {opacity:0} to {opacity:1}}
      @keyframes fadeAway {from {opacity:1} to {opacity:0}}

      .save-pill {animation:buttonPulse .6s ease .1s both}
      @keyframes buttonPulse {0%,100% {opacity:1} 50% {opacity:.7}}
      .crumb-step-1,.crumb-step-2,.crumb-step-3,.crumb-step-4 {animation:crumb 1s ease both}
      .crumb-step-1 {animation-delay:.15s}.crumb-step-2 {animation-delay:.45s}
      .crumb-step-3 {animation-delay:.75s}.crumb-step-4 {animation-delay:1.05s}
      @keyframes crumb {0%,100% {opacity:.65} 40%,65% {opacity:1}}
      .progress-fill {transform-box:fill-box;transform-origin:left center;animation:fillBar .8s cubic-bezier(.77,0,.175,1) 1.3s both}
      .status-ok,.hero-done {animation:complete .18s cubic-bezier(.23,1,.32,1) 2.1s both}
      .hero-pending {opacity:0;animation:fadeAway .18s ease 2.1s both}
      .card-focus {opacity:0;animation:highlight .7s ease both}
      @media (prefers-reduced-motion:reduce) {
        .save-pill,.crumb-step-1,.crumb-step-2,.crumb-step-3,.crumb-step-4,.progress-fill,.status-ok,.hero-done,.hero-pending,.card-focus {animation:none}
      }
</style>
  </defs>

  <g class="root" data-panel="surface">

    <rect x="0.5" y="0.5" width="1119" height="415" rx="20" fill="url(#bgSurface)" stroke="#2d2342" stroke-width="1" />
    <rect x="1" y="1" width="1118" height="414" rx="19.5" fill="url(#topGlow)" />
    <rect x="1" y="1" width="1118" height="414" rx="19.5" fill="url(#previewGlow)" />
    <line x1="24" y1="1.5" x2="1096" y2="1.5" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1" />


    <g transform="translate(36 32)">
